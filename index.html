<!doctype html>
<html lang="ru" class="th-a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>ТАРАРАМ — магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=f56bfddda7">
<link rel="icon" href="logo.png?v=f56bfddda7">
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <div class="brand">
      <span class="mark"><img src="logo.png?v=f56bfddda7" alt=""></span>
      <div><div class="logo">ТАРАРАМ</div><div class="tagline">посуда · упаковка · праздник</div></div>
    </div>
    <div class="hello" id="hello"><div class="hi" id="hi">Добрый день! 👋</div><h1>Всё для праздника и упаковки</h1></div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Стакан 250, коробка для торта…">
      <button class="clear" id="qclear" type="button" aria-label="Очистить" hidden>✕</button>
    </label>
  </header>

  <main id="view"><div class="loading"><span class="mark big"><img src="logo.png?v=f56bfddda7" alt=""></span>Загружаю каталог…</div></main>

  <div class="cta" id="cta" hidden><button id="ctabtn" type="button"></button></div>

  <nav class="tabs" id="tabs">
    <button data-tab="home" class="on" type="button"><span class="tiw"><span class="ti">🛍️</span></span><span>Каталог</span></button>
    <button data-tab="fav" type="button"><span class="tiw"><span class="ti">⭐</span></span><span>Избранное</span></button>
    <button data-tab="orders" type="button"><span class="tiw"><span class="ti">📋</span></span><span>Заказы</span></button>
    <button data-tab="cart" type="button"><span class="tiw"><span class="ti">🛒</span><b class="badge" id="badge" hidden></b></span><span>Корзина</span></button>
  </nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="backdrop" data-act="close"></div>
  <div class="sheet" id="sheetbody" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="app.js?v=f56bfddda7"></script>
</body>
</html>
